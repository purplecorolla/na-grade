name: tag-release

# Merging release/0.N.0 into main tags the merge commit as v0.N.0 and publishes a GitHub Release with
# generated notes (ADR 0007). After it: back-merge main -> develop
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: tag
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Criar a tag e a release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version="${HEAD_REF#release/}"
          if [[ ! "$version" =~ ^0\.[0-9]+\.0$ ]]; then
            echo "::error::Branch $HEAD_REF fora do formato release/0.N.0"
            exit 1
          fi
          gh release create "v$version" --repo "$REPO" --target "$SHA" --title "v$version" --generate-notes
          echo "## v$version publicada. Próximo passo: back-merge \`main → develop\` (merge commit)" >> "$GITHUB_STEP_SUMMARY"
