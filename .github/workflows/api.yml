name: api

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Testes, cobertura e build
        run: ./mvnw -B -ntp verify

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: services/api/target/site/jacoco/
          if-no-files-found: ignore

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: services/api/target/surefire-reports/
