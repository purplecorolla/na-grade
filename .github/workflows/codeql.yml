name: CodeQL

# Static analysis (SAST) of the api. Runs on every PR, so it can be a required check (#27)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch new queries even without code changes
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      # build-mode none doesn't analyze Kotlin: CodeQL has to watch the compiler
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compilar
        working-directory: services/api
        run: ./mvnw -B -ntp -DskipTests compile

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
