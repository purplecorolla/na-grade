spring.application.name=api
# Local dev: Spring Boot starts infra/docker-compose.yml and reads the credentials from the running containers,
# so only Docker Compose parses the .env (run from services/api). Skipped in tests (Testcontainers) and absent from the jar
spring.docker.compose.file=${user.dir}/../../infra/docker-compose.yml
spring.docker.compose.arguments=--env-file,${user.dir}/../../.env
spring.docker.compose.lifecycle-management=start-only
# Other environments (no Compose): connection from environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nagrade}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.same-site=lax
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
# Variables only the api uses (SPOTIFY_*, TOKEN_ENCRYPTION_KEY, SETLISTFM_API_KEY) come from the .env in local dev; never reference DB_* or REDIS_* from it.
# Read as .properties, not dotenv: no quotes around the values. Absent outside the repo (optional)
spring.config.import=optional:file:${user.dir}/../../.env[.properties]
# Spotify connection (ADR 0002): authorization code + PKCE (Spring Security 7 default) with the client secret.
# No default on purpose: without the variables the api refuses to start and says which one is missing
spring.security.oauth2.client.registration.spotify.client-id=${SPOTIFY_CLIENT_ID}
spring.security.oauth2.client.registration.spotify.client-secret=${SPOTIFY_CLIENT_SECRET}
spring.security.oauth2.client.registration.spotify.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.spotify.scope=user-top-read,playlist-modify-public,playlist-modify-private
spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
# Where the browser lands after connecting a provider (?connected=spotify or ?error=<code>); the frontend later
app.connections-return-url=/me/connections
# AES-256 key for the provider tokens at rest (ADR 0002), 32 bytes in base64: openssl rand -base64 32.
# No default on purpose, like the Spotify credentials
app.token-encryption-key=${TOKEN_ENCRYPTION_KEY}
# Outgoing HTTP calls (Spotify, setlist.fm): fail fast instead of holding a request thread forever
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
app.spotify.api-base-url=https://api.spotify.com/v1
# setlist.fm (#28). Key only from the environment, no default, like the Spotify credentials.
# The free key allows 2 requests/s and 1440/day. Calls are spaced by min-interval (two in the same second got a 429);
# the quota keeps a margin for manual tests with the same key and for the unknown hour the day resets (counted in UTC)
app.setlistfm.api-base-url=https://api.setlist.fm/rest/1.0
app.setlistfm.api-key=${SETLISTFM_API_KEY}
app.setlistfm.min-interval=600ms
app.setlistfm.daily-quota=1400
app.setlistfm.max-wait=2s
